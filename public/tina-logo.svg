<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Metallic Robot Shell Gradient -->
    <linearGradient id="botHeadGrad" x1="15" y1="15" x2="85" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="45%" stopColor="#F1F5F9" />
      <stop offset="85%" stopColor="#CBD5E1" />
      <stop offset="100%" stopColor="#94A3B8" />
    </linearGradient>

    <!-- Deep Glossy Visor Screen Gradient -->
    <linearGradient id="botVisorGrad" x1="26" y1="34" x2="74" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0B132B" />
      <stop offset="60%" stopColor="#070B19" />
      <stop offset="100%" stopColor="#030712" />
    </linearGradient>

    <!-- Cyan Neon Accent Gradient -->
    <linearGradient id="botCyanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="100%" stopColor="#06B6D4" />
    </linearGradient>

    <!-- Headset Metallic Trim Gradient -->
    <linearGradient id="botTrimGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#E2E8F0" />
      <stop offset="100%" stopColor="#64748B" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="botGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.2" floodColor="#38BDF8" floodOpacity="0.85" />
    </filter>
    <filter id="antennaGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" floodColor="#38BDF8" floodOpacity="0.95" />
    </filter>
  </defs>

  <!-- Neck Mount / Base Collar -->
  <path d="M40 76 L60 76 L63 85 Q50 88 37 85 Z" fill="#64748B" stroke="#475569" stroke-width="1.2" />
  <ellipse cx="50" cy="85" rx="14" ry="3.5" fill="#334155" />

  <!-- Antenna Stem -->
  <line x1="50" y1="21" x2="50" y2="9" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />

  <!-- Antenna Glowing Orb -->
  <circle cx="50" cy="8" r="5" fill="url(#botCyanGrad)" filter="url(#antennaGlow)" />
  <circle cx="48.5" cy="6.5" r="1.8" fill="#FFFFFF" opacity="0.9" />

  <!-- Left Headphone / Ear -->
  <rect x="13" y="42" width="7" height="20" rx="3.5" fill="url(#botTrimGrad)" stroke="#475569" stroke-width="1" />
  <rect x="15" y="45" width="3.5" height="14" rx="1.75" fill="url(#botCyanGrad)" opacity="0.9" />

  <!-- Right Headphone / Ear -->
  <rect x="80" y="42" width="7" height="20" rx="3.5" fill="url(#botTrimGrad)" stroke="#475569" stroke-width="1" />
  <rect x="81.5" y="45" width="3.5" height="14" rx="1.75" fill="url(#botCyanGrad)" opacity="0.9" />

  <!-- Robot Head Helmet -->
  <rect x="18" y="21" width="64" height="57" rx="27" fill="url(#botHeadGrad)" stroke="#E2E8F0" stroke-width="1" />

  <!-- Specular Light Reflection across Top Curve -->
  <path d="M28 25 C37 23 63 23 72 25 C66 29 34 29 28 25 Z" fill="#FFFFFF" opacity="0.8" />

  <!-- Visor Bezel / Rim -->
  <rect x="24.5" y="34.5" width="51" height="36" rx="16" fill="#1E293B" />

  <!-- Glossy Visor Screen -->
  <rect x="26" y="36" width="48" height="33" rx="14.5" fill="url(#botVisorGrad)" />

  <!-- Visor Glass Curved Reflection -->
  <path d="M28 39 Q50 35 72 39 Q66 43 28 43 Z" fill="#FFFFFF" opacity="0.12" />

  <!-- Rosy Cute Blush -->
  <circle cx="33" cy="56.5" r="2.2" fill="#F43F5E" opacity="0.5" />
  <circle cx="67" cy="56.5" r="2.2" fill="#F43F5E" opacity="0.5" />

  <!-- Friendly Glowing Eyes -->
  <g filter="url(#botGlow)">
    <!-- Left Eye (Happy pill) -->
    <rect x="35" y="44" width="8.5" height="11.5" rx="4.25" fill="#38BDF8" />
    <circle cx="37.5" cy="46.5" r="1.6" fill="#FFFFFF" />
    <circle cx="41" cy="52" r="0.8" fill="#E0F2FE" />

    <!-- Right Eye (Happy pill) -->
    <rect x="56.5" y="44" width="8.5" height="11.5" rx="4.25" fill="#38BDF8" />
    <circle cx="59" cy="46.5" r="1.6" fill="#FFFFFF" />
    <circle cx="62.5" cy="52" r="0.8" fill="#E0F2FE" />
  </g>

  <!-- Friendly Glowing Smile -->
  <path d="M43.5 59.5 Q50 64.5 56.5 59.5" stroke="#38BDF8" stroke-width="2.6" stroke-linecap="round" fill="none" filter="url(#botGlow)" />
</svg>
